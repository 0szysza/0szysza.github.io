  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef2f8;background:#0b0d17;font-synthesis:none}
    *{box-sizing:border-box}
    html{color-scheme:dark}
    body{min-width:320px;min-height:100vh;min-height:100svh;display:grid;place-items:center;margin:0;background:radial-gradient(ellipse 520px 310px at 50% 49%,rgba(43,61,103,.14),transparent 80%),#0b0d17}

    :focus-visible{outline:2px solid #5cddfa;outline-offset:4px}
    main{width:min(100% - 40px,660px);padding:54px 0}
    h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
    .signature{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:26px;color:#a7b6cb;font-size:12px;font-weight:800;letter-spacing:.1em}
    .signature img{width:21px;height:21px}
    .choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .choice{--accent:#5cddfa;--aura:rgba(92,221,250,.09);position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:205px;overflow:hidden;padding:23px;border:1px solid #2d3954;border-radius:16px;background:radial-gradient(circle at 14% 8%,var(--aura),transparent 48%),linear-gradient(145deg,#192137,#121827 85%);box-shadow:0 20px 38px rgba(0,0,0,.13),inset 0 1px 0 rgba(255,255,255,.025);transition:border-color .2s,box-shadow .2s,transform .2s}
    .choice::before{position:absolute;top:0;left:23px;width:70px;height:2px;background:var(--accent);content:"";opacity:.6;transition:width .2s,opacity .2s}
    .choice:hover,.choice:focus-visible{border-color:var(--accent);box-shadow:0 24px 48px rgba(0,0,0,.22),0 0 32px var(--aura);transform:translateY(-3px)}
    .choice:hover::before,.choice:focus-visible::before{width:110px;opacity:1}
    .choice.rebirth{--accent:#a38ffa;--aura:rgba(163,143,250,.1)}
    .choice-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .choice-icon{display:grid;place-items:center;width:55px;height:55px;border:1px solid #3b4965;border-radius:13px;background:rgba(31,44,70,.88);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
    .choice-icon img{display:block;width:38px;height:38px;object-fit:contain}
    .choice-bottom{display:flex;align-items:end;justify-content:space-between;gap:10px}
    .choice-arrow{display:grid;place-items:center;width:30px;height:30px;flex:none;border:1px solid #35415a;border-radius:8px;color:#8d9eb7;transition:border-color .2s,color .2s,transform .2s}
    .choice-arrow svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .choice:hover .choice-arrow,.choice:focus-visible .choice-arrow{border-color:var(--accent);color:var(--accent);transform:translate(2px,-2px)}
    .choice-name{display:block;color:#f8fafc;font-size:19px;font-weight:750;letter-spacing:-.035em;line-height:1.2}
    .socials{display:flex;align-items:center;justify-content:center;gap:29px;margin-top:43px}
    .socials a{display:inline-flex;align-items:center;gap:8px;color:#8d9ab0;font-size:12px;font-weight:600;transition:color .15s}
    .socials a:hover{color:#fff}
    .socials svg{width:16px;height:16px;flex:none}
    @media(max-width:600px){main{width:min(100% - 32px,420px)}.signature{margin-bottom:24px}.choices{grid-template-columns:1fr;gap:13px}.choice{min-height:151px;padding:20px}.choice-icon{width:47px;height:47px}.choice-icon img{width:33px;height:33px}.choice-name{font-size:18px}.socials{margin-top:37px}}
    @media(prefers-reduced-motion:reduce){.choice,.choice::before,.choice-arrow{transition:none}}
  </style>
</head>
