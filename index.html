  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f3f4f6;background:#0b0d17;font-synthesis:none}
    *{box-sizing:border-box}
    html{color-scheme:dark}
    body{min-width:320px;min-height:100vh;min-height:100svh;display:grid;place-items:center;margin:0;background:#0b0d17}
    a{color:inherit;text-decoration:none}
    :focus-visible{outline:2px solid #5cddfa;outline-offset:3px}
    main{width:min(100% - 36px,880px);padding:44px 0}
    h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
    .choices{display:grid;grid-template-columns:minmax(0,1fr) 1px minmax(0,1fr);align-items:center}
    .tool{display:flex;align-items:center;justify-content:center;gap:14px;min-width:0;min-height:108px;padding:16px;border-radius:10px;transition:transform .22s ease}
    .tool:hover,.tool:focus-visible{transform:scale(1.045)}
    .tool:focus-visible{outline:none}
    .tool:focus-visible strong{text-decoration:underline;text-underline-offset:5px}
    .tool img{display:block;width:56px;height:56px;flex:none;object-fit:contain}
    .tool-copy{display:flex;flex-direction:column;min-width:0}
    .tool-copy strong{color:#fff;font-size:24px;font-weight:800;letter-spacing:-.6px;line-height:32px;white-space:nowrap}
    .tool-copy small{color:#94a3b8;font-size:12px;font-weight:400;line-height:18px;white-space:nowrap}
    .divider{width:1px;height:54px;background:#2a334b}
    .socials{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:72px}
    .socials a{display:inline-flex;align-items:center;gap:7px;color:#94a3b8;font-size:12px;font-weight:600;transition:color .16s}
    .socials a:hover{color:#fff}
    .socials svg{width:16px;height:16px;flex:none}
    @media(max-width:750px){
      body{padding:max(20px,env(safe-area-inset-top)) 0 max(20px,env(safe-area-inset-bottom))}
      main{width:min(100% - 40px,360px);padding:24px 0}
      .choices{grid-template-columns:1fr}
      .tool{flex-direction:column;justify-content:center;gap:14px;min-height:150px;padding:16px 12px;text-align:center}
      .tool img{width:64px;height:64px}
      .tool-copy{align-items:center;gap:2px}
      .tool-copy strong{font-size:22px;line-height:28px;white-space:normal}
      .tool-copy small{font-size:11px;line-height:18px;white-space:normal}
      .tool:hover,.tool:focus-visible{transform:none}
      .tool:active{transform:scale(.98)}
      .divider{width:80px;height:1px;justify-self:center;margin:24px 0}
      .socials{margin-top:40px;gap:32px}
      .socials a{min-height:44px;font-size:12px}
    }
    @media(prefers-reduced-motion:reduce){.tool,.socials a{transition:none}.tool:hover,.tool:focus-visible,.tool:active{transform:none}}
  </style>
